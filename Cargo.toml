[workspace]
resolver = "2"
members = ["crates/cli", "crates/pyast", "crates/pyinfer", "crates/pycheckers"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace.dependencies]
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.15.16" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.15.16" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.15.16" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff", tag = "0.15.16" }
rayon = "1.10"
rustc-hash = "2"
indexmap = "2"
regex = "1.11"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
